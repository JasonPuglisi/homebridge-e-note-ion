name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm test

      # engines declares homebridge "^1.8.0 || ^2.0.0". The devDependency only
      # pins one of them, so typecheck against the other too — otherwise a type
      # that changed across the majors ships silently and surfaces as a user
      # crash. Installed without touching package.json or the lockfile.
      - name: Typecheck against Homebridge 1
        run: |
          npm install --no-save --no-package-lock homebridge@^1.8.0
          npx tsc --noEmit
