# Weekly grouped updates, mirroring the e-note-ion repo's setup so both
# projects stay current the same way.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @types/node tracks the LOWEST Node major in engines (currently ^22), not
      # the newest release. Typechecking against newer types would accept APIs
      # that do not exist on the oldest runtime we claim to support. Raise this
      # when engines drops a major, not when a new @types/node ships.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
